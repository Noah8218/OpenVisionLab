name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  build:
    name: Clean-clone release candidate gate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Verify Debug, Release, policies, public samples, and package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools\VerifyReleaseCandidate.ps1 -SkipLaunch -OutputDir artifacts\ci_release_candidate

      - name: Upload verified portable release candidate (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: OpenVisionLab-win-x64-framework-dependent-${{ github.sha }}
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/OpenVisionLab-win-x64-framework-dependent.zip
            dist/OpenVisionLab-win-x64-framework-dependent.zip.sha256
            dist/OpenVisionLab/clean_runtime_manifest.json
            artifacts/ci_release_candidate/release_candidate_summary.json
            artifacts/ci_release_candidate/public_sample_catalog/sample_catalog_summary.json
